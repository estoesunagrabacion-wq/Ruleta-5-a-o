<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Ruleta del Doctor H — 3.º Año 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;transition:background 0.5s;}
  canvas.bg{position:fixed;inset:0;pointer-events:none;z-index:0;}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;display:none;}
  .star{position:absolute;border-radius:50%;background:#fff;}
  #app{position:relative;z-index:10;width:100%;max-width:440px;border-radius:28px;border:2px solid transparent;padding:20px 18px 22px;transition:all 0.5s;}
  .screws{display:flex;justify-content:space-between;padding:0 2px;}
  .screw{width:16px;height:16px;border-radius:50%;position:relative;flex-shrink:0;}
  .screw::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);width:58%;height:2px;background:rgba(0,0,0,0.6);border-radius:1px;}
  .screw::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-45deg);width:58%;height:2px;background:rgba(0,0,0,0.4);border-radius:1px;}
  #toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px;}
  #fsbtn{border-radius:10px;padding:5px 10px;cursor:pointer;line-height:0;touch-action:manipulation;}
  #titleplate{border-radius:14px;padding:11px 16px;margin-bottom:12px;text-align:center;}
  #maintitle{font-size:clamp(18px,5vw,24px);font-weight:900;letter-spacing:1px;line-height:1.1;}
  #subtitle{font-size:clamp(11px,3vw,14px);font-weight:600;margin-top:3px;}
  #coursebadge{text-align:center;margin-bottom:12px;}
  #coursebadge span{display:inline-block;border-radius:999px;padding:5px 18px;font-size:clamp(13px,3.5vw,17px);font-weight:800;letter-spacing:1.5px;}
  #screen{border-radius:16px;border:2px solid transparent;overflow:hidden;margin-bottom:14px;display:flex;justify-content:center;position:relative;}
  #screen::before{content:'';position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,rgba(255,255,255,0.06),transparent);pointer-events:none;border-radius:14px 14px 0 0;z-index:2;}
  #screen::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:3;}
  #reel{display:block;}
  #winner{border-radius:14px;padding:12px 16px;text-align:center;margin-bottom:14px;display:none;}
  #winner .wlabel{font-size:10px;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:2.5px;}
  #winner .wname{font-size:clamp(18px,5.5vw,24px);font-weight:900;margin-top:4px;min-height:1.5em;letter-spacing:1px;line-height:1.3;}
  .btnrow{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
  button{cursor:pointer;touch-action:manipulation;border:none;outline:none;}
  #spinbtn{color:#fff;font-weight:900;font-size:16px;padding:13px 30px;border-radius:14px;display:flex;align-items:center;gap:8px;letter-spacing:1px;transition:transform .1s,opacity .2s;}
  #spinbtn:disabled{opacity:.45;transform:scale(.97);}
  .iconbtn{color:#ccc;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,#1a1a1a,#333);border:1px solid #555;box-shadow:0 4px 12px rgba(0,0,0,.6);}
  .themebtnrow{display:flex;gap:6px;justify-content:center;}
  .themebtn{padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;border:2px solid transparent;}
  #settings{background:rgba(0,0,0,.5);border-radius:14px;padding:14px;margin-top:10px;display:none;border:1px solid transparent;}
  .togglerow{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
  .togglebtn{color:#fff;border:none;border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;cursor:pointer;}
  .slidrow{display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa;margin-bottom:6px;}
  .slidrow span.lbl{width:44px;}
  .slidrow input{flex:1;height:20px;}
  .slidrow span.val{width:28px;text-align:right;}
  #history{border-top:1px solid transparent;padding-top:10px;margin-top:4px;display:none;}
  #history .hlabel{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
  #histlist{display:flex;flex-wrap:wrap;gap:4px;}
  .htag{font-size:10px;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid transparent;}
  @keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes letterPop{0%{transform:scale(1.4) translateY(-2px)}100%{transform:scale(1)}}
  input[type=range]{height:20px;}
</style>
</head>
<body>
<canvas class="bg" id="bgcanvas"></canvas>
<div id="stars"></div>

<div id="app">
  <div id="toprow">
    <div class="screw" id="s1"></div>
    <button id="fsbtn" title="Pantalla completa">
      <svg id="fsicon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
    <div class="screw" id="s2"></div>
  </div>
  <div id="titleplate">
    <div id="maintitle"></div>
    <div id="subtitle"></div>
  </div>
  <div id="coursebadge"><span>3.º AÑO · 2026</span></div>
  <div id="screen"><canvas id="reel"></canvas></div>
  <div id="winner"><div class="wlabel">✦ seleccionado/a ✦</div><div class="wname" id="winnername"></div></div>
  <div class="btnrow">
    <button id="spinbtn" onclick="spin()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      <span id="spinlbl">GIRAR</span>
    </button>
    <button class="iconbtn" onclick="resetReel()" title="Reiniciar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
    </button>
    <button class="iconbtn" id="settingsbtn" onclick="toggleSettings()" title="Ajustes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="themebtnrow" style="margin-bottom:0;">
    <button class="themebtn" id="tbtn-dark"  onclick="setTheme('dark')">😈</button>
    <button class="themebtn" id="tbtn-light" onclick="setTheme('light')">😇</button>
    <button class="themebtn" id="tbtn-space" onclick="setTheme('space')">🚀</button>
  </div>
  <div id="settings">
    <div class="togglerow">
      <button class="togglebtn" id="sfxbtn" onclick="toggleSfx()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <span id="sfxlbl">Efectos ON</span>
      </button>
      <button class="togglebtn" id="musicbtn" onclick="toggleMusic()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span id="musiclbl">Música ON</span>
      </button>
    </div>
    <div class="slidrow" id="sfxrow">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <span class="lbl">Efectos</span>
      <input type="range" min="0" max="1" step="0.05" value="1.0" oninput="sfxVol=+this.value;document.getElementById('sfxval').textContent=Math.round(sfxVol*100)+'%'"/>
      <span class="val" id="sfxval">100%</span>
    </div>
    <div class="slidrow" id="musicrow">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="lbl">Música</span>
      <input type="range" min="0" max="1" step="0.05" value="1.0" oninput="musicVol=+this.value;document.getElementById('musicval').textContent=Math.round(musicVol*100)+'%';restartMusic()"/>
      <span class="val" id="musicval">100%</span>
    </div>
  </div>
  <div id="history">
    <div class="hlabel" id="hlabel"></div>
    <div id="histlist"></div>
  </div>
  <div class="screws" style="margin-top:14px;">
    <div class="screw" id="s3"></div><div class="screw" id="s4"></div>
  </div>
</div>

<script>
const NAMES = [
  "Becerra, Isabella","Chiu B., Iván","Dufour G., Giuliana","Garabedian G., Anush",
  "Gasparyan, Harutyun","Gatti, Ariel","Kim, Elena","Liberman, Milena",
  "Luna E., Julia","Monges A., Ezequiel","Morales R., Joaquín","Piriz, Mateo",
  "Rivadero F., Itzel","Romera D., Fernando","Ros C., Pilar","Soghoyan, Hamlet",
  "Windecker, Agustín","Zamorano, Keira"
];

const THEMES = {
  dark:{
    title:"Ruleta Satánica",subtitle:"del Malvado Doctor H",
    bg1:"#0d0005",bg2:"#1a0008",metal1:"#1a0000",metal2:"#3a0808",metal3:"#0a0000",
    rim:"#cc1111",rimGlow:"#ff0000",screenBg1:"#0a0000",screenBg2:"#1f0505",
    nameColor:"#ff4444",accentColor:"#ff2020",btnBg1:"#5a0000",btnBg2:"#990000",
    screwColor:"#2a0000",courseColor:"#ff6666",
    notes:[65,69,73,65,61,65,69,61],tempo:580
  },
  light:{
    title:"Ruleta Amable",subtitle:"del Simpático Doctor H",
    bg1:"#1a0a2e",bg2:"#2d1155",metal1:"#c8a8f8",metal2:"#e8d0ff",metal3:"#a070e0",
    rim:"#c084fc",rimGlow:"#e879f9",screenBg1:"#0f0520",screenBg2:"#1e0a3a",
    nameColor:"#f0abfc",accentColor:"#c084fc",btnBg1:"#5b21b6",btnBg2:"#7c3aed",
    screwColor:"#7c3aed",courseColor:"#d8b4fe",
    notes:[523,659,784,659,698,784,880,659],tempo:500
  },
  space:{
    title:"Ruleta Cuántica",subtitle:"del Excéntrico Doctor H",
    bg1:"#00000f",bg2:"#000820",metal1:"#0a1a2a",metal2:"#0d2a3a",metal3:"#050f1a",
    rim:"#00d4ff",rimGlow:"#00ffff",screenBg1:"#000510",screenBg2:"#001020",
    nameColor:"#67e8f9",accentColor:"#00d4ff",btnBg1:"#0c4a6e",btnBg2:"#0369a1",
    screwColor:"#0369a1",courseColor:"#a5f3fc",
    notes:[261,329,392,349,329,261,220,261],tempo:620
  }
};

const REEL_W=340, REEL_H=280, SLOT_COUNT=7, SLOT_H=REEL_H/SLOT_COUNT;
let theme="dark", idx=0, spinning=false, winner=null;
let soundOn=true, musicOn=true, sfxVol=1.0, musicVol=1.0;
let historyArr=[], settingsOpen=false, timerRef=null, musicInterval=null, audioCtx=null;

function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}

function playNote(freq,dur,type,vol){
  if(!soundOn)return;
  try{
    const c=getAudioCtx();
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.2,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);
  }catch(e){}
}

function playFanfare(vol){
  if(!soundOn)return;
  vol=vol||1.0;
  const notes=[[220,0.00,0.20],[293,0.22,0.20],[220,0.44,0.24],[164,0.70,0.32],[220,1.05,0.65],[329,1.10,0.60],[440,1.18,0.90]];
  notes.forEach(([freq,when,dur])=>{
    const c=getAudioCtx();
    [[freq,"sawtooth",vol*0.45],[freq*2.01,"square",vol*0.12],[freq*0.5,"sine",vol*0.18]].forEach(([f,type,v])=>{
      try{
        const o=c.createOscillator(),g=c.createGain(),flt=c.createBiquadFilter();
        flt.type="lowpass";flt.frequency.value=2400;
        o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(0,c.currentTime+when);
        g.gain.linearRampToValueAtTime(v,c.currentTime+when+0.025);
        g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+when+dur);
        o.connect(flt);flt.connect(g);g.connect(c.destination);
        o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+0.05);
      }catch(e){}
    });
  });
}

function stopMusic(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}}

function restartMusic(){
  stopMusic();if(!musicOn)return;
  const t=THEMES[theme];let i=0;
  musicInterval=setInterval(()=>{
    try{
      const c=getAudioCtx();const freq=t.notes[i%t.notes.length];const dur=0.5;const vol=musicVol*0.07;
      [[1,"sine",vol*0.6],[1.005,"triangle",vol*0.25],[0.5,"sine",vol*0.15]].forEach(([ratio,type,v])=>{
        const o=c.createOscillator(),g=c.createGain(),flt=c.createBiquadFilter();
        flt.type="lowpass";
        flt.frequency.value=theme==="dark"?800:theme==="space"?2200:3500;
        o.type=type;o.frequency.value=freq*ratio;
        g.gain.setValueAtTime(0,c.currentTime);
        g.gain.linearRampToValueAtTime(v,c.currentTime+0.04);
        g.gain.setValueAtTime(v,c.currentTime+dur*0.55);
        g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
        o.connect(flt);flt.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+dur+0.05);
      });
      i++;
    }catch(e){}
  }, t.tempo);
}

function drawReel(){
  const cv=document.getElementById("reel");
  const dpr=Math.min(window.devicePixelRatio||1, 3);
  cv.width=Math.round(REEL_W*dpr);cv.height=Math.round(REEL_H*dpr);
  cv.style.width=REEL_W+"px";cv.style.height=REEL_H+"px";
  const ctx=cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const t=THEMES[theme];
  ctx.clearRect(0,0,REEL_W,REEL_H);
  const cx=REEL_W/2,cy=REEL_H/2,half=Math.floor(SLOT_COUNT/2);

  const sideGrad=ctx.createLinearGradient(0,0,REEL_W,0);
  sideGrad.addColorStop(0,"rgba(0,0,0,0.4)");
  sideGrad.addColorStop(0.12,"rgba(0,0,0,0)");
  sideGrad.addColorStop(0.88,"rgba(0,0,0,0)");
  sideGrad.addColorStop(1,"rgba(0,0,0,0.4)");

  for(let i=-half;i<=half;i++){
    const ni=((idx+i)%NAMES.length+NAMES.length)%NAMES.length;
    const dist=Math.abs(i);
    const theta=i/SLOT_COUNT*Math.PI*0.9;
    const y=cy+Math.sin(theta)*(REEL_H*0.47);
    const cosT=Math.cos(theta);
    const opacity=Math.max(0,cosT*(dist===0?1:0.7));
    const slotH=SLOT_H*Math.abs(cosT);
    if(slotH<2)continue;

    if(dist===0){
      const rb=ctx.createLinearGradient(0,y-slotH/2,0,y+slotH/2);
      rb.addColorStop(0,t.screenBg2+"ee");
      rb.addColorStop(0.5,t.screenBg1+"cc");
      rb.addColorStop(1,t.screenBg2+"ee");
      ctx.fillStyle=rb;ctx.fillRect(0,y-slotH/2,REEL_W,slotH);
      ctx.fillStyle=t.rim+"22";ctx.fillRect(0,y-slotH/2,REEL_W,slotH);
    }
    ctx.strokeStyle=t.rim+"44";ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(16,y+slotH/2);ctx.lineTo(REEL_W-16,y+slotH/2);ctx.stroke();

    const fs=dist===0?Math.max(16,Math.min(22,REEL_W*0.062)):Math.max(10,14-dist*2);
    ctx.font=(dist===0?"800":"500")+" "+fs+"px 'Segoe UI',system-ui,sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.globalAlpha=opacity;

    if(dist===0){
      ctx.shadowColor=t.rimGlow;ctx.shadowBlur=spinning?22:14;
      ctx.fillStyle=t.rimGlow+"88";ctx.fillText(NAMES[ni],cx,y);
      ctx.shadowBlur=0;ctx.fillStyle=t.nameColor;ctx.fillText(NAMES[ni],cx,y);
    }else{
      ctx.shadowColor=t.rimGlow;ctx.shadowBlur=4;
      ctx.fillStyle=t.nameColor+Math.round(opacity*160).toString(16).padStart(2,"0");
      ctx.fillText(NAMES[ni],cx,y);ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }

  ctx.fillStyle=sideGrad;ctx.fillRect(0,0,REEL_W,REEL_H);

  const tm=ctx.createLinearGradient(0,0,0,REEL_H*.28);
  tm.addColorStop(0,t.screenBg1+"ff");tm.addColorStop(1,t.screenBg1+"00");
  ctx.fillStyle=tm;ctx.fillRect(0,0,REEL_W,REEL_H*.28);

  const bm=ctx.createLinearGradient(0,REEL_H*.72,0,REEL_H);
  bm.addColorStop(0,t.screenBg1+"00");bm.addColorStop(1,t.screenBg1+"ff");
  ctx.fillStyle=bm;ctx.fillRect(0,REEL_H*.72,REEL_W,REEL_H*.28);

  const winY=cy-SLOT_H/2-2,winH=SLOT_H+4;
  ctx.shadowColor=t.rimGlow;ctx.shadowBlur=spinning?24:12;
  ctx.strokeStyle=t.rimGlow;ctx.lineWidth=2;
  ctx.strokeRect(12,winY,REEL_W-24,winH);ctx.shadowBlur=0;

  ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(12,winY);ctx.lineTo(REEL_W-12,winY);ctx.stroke();

  [[6,false],[REEL_W-6,true]].forEach(([ax,right])=>{
    ctx.shadowColor=t.rimGlow;ctx.shadowBlur=10;
    ctx.fillStyle=t.rimGlow;ctx.beginPath();
    if(!right){ctx.moveTo(ax,cy-8);ctx.lineTo(ax+10,cy);ctx.lineTo(ax,cy+8);}
    else{ctx.moveTo(ax,cy-8);ctx.lineTo(ax-10,cy);ctx.lineTo(ax,cy+8);}
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  });
}

// Letter-by-letter animated winner reveal
function revealText(name){
  const el=document.getElementById("winnername");
  el.innerHTML="";
  const spans=[];
  for(let i=0;i<name.length;i++){
    const s=document.createElement("span");
    s.textContent=name[i];
    s.style.cssText="color:transparent;display:inline-block;transition:transform 0.12s cubic-bezier(.34,1.56,.64,1);";
    el.appendChild(s);
    spans.push(s);
  }
  const t=THEMES[theme];
  let i=0;
  const iv=setInterval(()=>{
    if(i>=spans.length){clearInterval(iv);return;}
    const s=spans[i];
    s.style.color="#fff";
    s.style.textShadow=`0 0 28px #fff,0 0 14px ${t.rimGlow},0 0 40px ${t.rimGlow}`;
    s.style.transform="scale(1.4) translateY(-2px)";
    setTimeout(()=>{
      s.style.transform="scale(1)";
      s.style.textShadow=`0 0 12px ${t.rimGlow}`;
    },130);
    i++;
  },70);
}

function applyTheme(){
  const t=THEMES[theme];
  document.body.style.background=`radial-gradient(ellipse at 50% 25%,${t.bg2},${t.bg1} 75%)`;
  const app=document.getElementById("app");
  app.style.background=`linear-gradient(160deg,${t.metal2} 0%,${t.metal1} 45%,${t.metal3} 100%)`;
  app.style.border=`2px solid ${t.rim}77`;
  app.style.boxShadow=`0 0 70px ${t.rimGlow}55,0 24px 64px rgba(0,0,0,.85),inset 0 2px 0 rgba(255,255,255,.15),inset 0 -2px 0 rgba(0,0,0,.6)`;

  const tp=document.getElementById("titleplate");
  tp.style.background=`linear-gradient(180deg,${t.metal2}dd,${t.metal1}cc,${t.metal3}99)`;
  tp.style.border=`1px solid ${t.rim}55`;
  tp.style.boxShadow="inset 0 2px 0 rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.5)";

  const mt=document.getElementById("maintitle");
  mt.style.color=t.accentColor;
  mt.style.textShadow=`0 0 24px ${t.rimGlow},0 2px 4px rgba(0,0,0,.8)`;
  mt.textContent=t.title;

  const st=document.getElementById("subtitle");
  st.style.color=t.rim;
  st.style.textShadow=`0 0 12px ${t.rimGlow}88`;
  st.textContent=t.subtitle;

  const cb=document.querySelector("#coursebadge span");
  cb.style.background=`linear-gradient(135deg,${t.btnBg1}88,${t.btnBg2}88)`;
  cb.style.border=`1px solid ${t.rim}77`;
  cb.style.color=t.courseColor;
  cb.style.textShadow=`0 0 10px ${t.rimGlow}99`;
  cb.style.boxShadow=`0 0 16px ${t.rimGlow}33`;

  const sc=document.getElementById("screen");
  sc.style.background=`radial-gradient(ellipse at 50% 35%,${t.screenBg2},${t.screenBg1} 80%)`;
  sc.style.borderColor=t.rim+"99";
  sc.style.boxShadow=`inset 0 0 40px rgba(0,0,0,.9),0 0 30px ${t.rimGlow}44`;

  const sb=document.getElementById("spinbtn");
  sb.style.background=`linear-gradient(135deg,${t.btnBg1},${t.btnBg2})`;
  sb.style.border=`1px solid ${t.rim}77`;
  sb.style.boxShadow=`0 6px 20px rgba(0,0,0,.6),0 0 24px ${t.rimGlow}55,inset 0 1px 0 rgba(255,255,255,.2)`;

  const fsbtn=document.getElementById("fsbtn");
  fsbtn.style.background=`linear-gradient(135deg,${t.metal3},${t.metal1})`;
  fsbtn.style.border=`1px solid ${t.rim}66`;
  fsbtn.style.borderRadius="10px";
  fsbtn.style.boxShadow=`0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)`;
  fsbtn.style.color=t.rim;
  fsbtn.style.padding="5px 10px";
  fsbtn.style.lineHeight="0";

  const screwStyle=`radial-gradient(circle at 30% 30%,#ccc,${t.screwColor} 55%,#000)`;
  const screwShadow="inset 0 2px 3px rgba(255,255,255,.4),inset 0 -1px 2px rgba(0,0,0,.8),0 2px 4px rgba(0,0,0,.9)";
  ["s1","s2","s3","s4"].forEach(id=>{
    const s=document.getElementById(id);
    s.style.background=screwStyle;
    s.style.boxShadow=screwShadow;
  });

  Object.keys(THEMES).forEach(k=>{
    const btn=document.getElementById("tbtn-"+k);const tv=THEMES[k];
    btn.style.border=`2px solid ${tv.rim}${theme===k?"ff":"44"}`;
    btn.style.background=theme===k?`linear-gradient(135deg,${tv.btnBg1},${tv.btnBg2})`:"transparent";
    btn.style.color=theme===k?"#fff":tv.rim;
    btn.style.boxShadow=theme===k?`0 0 16px ${tv.rimGlow}77`:"none";
  });

  document.getElementById("settings").style.borderColor=t.rim+"33";
  document.getElementById("hlabel").style.color=t.rim+"88";
  document.querySelectorAll(".htag").forEach(el=>{
    el.style.color=t.nameColor;el.style.background=t.rim+"18";el.style.borderColor=t.rim+"33";
  });
  document.getElementById("history").style.borderTopColor=t.rim+"22";

  if(winner){
    const wEl=document.getElementById("winner");
    wEl.style.background=`linear-gradient(90deg,${t.btnBg1},${t.btnBg2}cc,${t.btnBg1})`;
    wEl.style.border=`1px solid ${t.rim}99`;
    wEl.style.boxShadow=`0 0 32px ${t.rimGlow}77`;
    wEl.style.animation="pop .4s cubic-bezier(.34,1.56,.64,1)";
  }

  document.getElementById("stars").style.display=theme==="space"?"block":"none";
  drawReel();
}

function setTheme(k){theme=k;applyTheme();restartMusic();}

function spin(){
  if(spinning)return;
  spinning=true;winner=null;
  document.getElementById("winner").style.display="none";
  document.getElementById("spinbtn").disabled=true;
  document.getElementById("spinlbl").textContent="GIRANDO…";
  if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
  if(soundOn)playNote(65,0.4,"sawtooth",sfxVol*0.3);
  const finalIdx=Math.floor(Math.random()*NAMES.length);
  const totalSteps=48+Math.floor(Math.random()*18);
  let step=0;
  function go(){
    step++;
    const delay=Math.round(6+130*Math.pow(step/totalSteps,2.8));
    idx=(idx+1)%NAMES.length;
    drawReel();
    if(soundOn&&step%2===0)playNote(220+step*3,0.05,"sine",sfxVol*0.08);
    if(step<totalSteps){
      timerRef=setTimeout(go,delay);
    }else{
      idx=finalIdx;drawReel();spinning=false;winner=NAMES[finalIdx];
      document.getElementById("spinbtn").disabled=false;
      document.getElementById("spinlbl").textContent="GIRAR";
      const t=THEMES[theme];
      const wEl=document.getElementById("winner");
      wEl.style.display="block";
      wEl.style.background=`linear-gradient(90deg,${t.btnBg1},${t.btnBg2}cc,${t.btnBg1})`;
      wEl.style.border=`1px solid ${t.rim}99`;
      wEl.style.boxShadow=`0 0 32px ${t.rimGlow}77`;
      wEl.style.animation="none";
      requestAnimationFrame(()=>{ wEl.style.animation="pop .4s cubic-bezier(.34,1.56,.64,1)"; });
      revealText(winner);
      historyArr.unshift(winner);if(historyArr.length>5)historyArr.pop();
      updateHistory();
      playFanfare(sfxVol);
    }
  }
  go();
}

function resetReel(){
  if(timerRef)clearTimeout(timerRef);
  spinning=false;winner=null;idx=0;
  document.getElementById("winner").style.display="none";
  document.getElementById("spinbtn").disabled=false;
  document.getElementById("spinlbl").textContent="GIRAR";
  drawReel();
}

function toggleSettings(){
  settingsOpen=!settingsOpen;
  document.getElementById("settings").style.display=settingsOpen?"block":"none";
  const t=THEMES[theme];const btn=document.getElementById("settingsbtn");
  btn.style.background=settingsOpen?`linear-gradient(135deg,${t.btnBg1},${t.btnBg2})`:"linear-gradient(135deg,#1a1a1a,#333)";
  btn.style.border=`1px solid ${settingsOpen?t.rim+"88":"#555"}`;
  btn.style.color=settingsOpen?"#fff":"#ccc";
}

function toggleSfx(){
  soundOn=!soundOn;
  document.getElementById("sfxbtn").style.background=soundOn?"#14532d":"#2a2a2a";
  document.getElementById("sfxbtn").style.border=`1px solid ${soundOn?"#22c55e":"#555"}`;
  document.getElementById("sfxlbl").textContent=soundOn?"Efectos ON":"Efectos OFF";
  document.getElementById("sfxrow").style.display=soundOn?"flex":"none";
}

function toggleMusic(){
  musicOn=!musicOn;
  document.getElementById("musicbtn").style.background=musicOn?"#14532d":"#2a2a2a";
  document.getElementById("musicbtn").style.border=`1px solid ${musicOn?"#22c55e":"#555"}`;
  document.getElementById("musiclbl").textContent=musicOn?"Música ON":"Música OFF";
  document.getElementById("musicrow").style.display=musicOn?"flex":"none";
  musicOn?restartMusic():stopMusic();
}

function updateHistory(){
  const hl=document.getElementById("histlist");hl.innerHTML="";
  const t=THEMES[theme];
  historyArr.forEach(h=>{
    const s=document.createElement("span");s.className="htag";s.textContent=h;
    s.style.color=t.nameColor;s.style.background=t.rim+"18";s.style.borderColor=t.rim+"33";
    hl.appendChild(s);
  });
  document.getElementById("history").style.display=historyArr.length>0?"block":"none";
  document.getElementById("hlabel").textContent="Últimos sorteados";
  document.getElementById("hlabel").style.color=THEMES[theme].rim+"88";
}

// Fullscreen button
(function(){
  const btn=document.getElementById("fsbtn");
  const expand=`<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
  const compress=`<polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/><polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/>`;
  btn.addEventListener("click",()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
    }else{
      document.exitFullscreen&&document.exitFullscreen().catch(()=>{});
    }
  });
  document.addEventListener("fullscreenchange",()=>{
    const icon=document.getElementById("fsicon");
    icon.innerHTML=document.fullscreenElement?compress:expand;
  });
})();

// Background particles
(function(){
  const cv=document.getElementById("bgcanvas");const ctx=cv.getContext("2d");const pts=[];
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  resize();window.addEventListener("resize",resize);
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(theme==="dark"){
      for(let i=0;i<3;i++)pts.push({x:Math.random()*cv.width,y:cv.height+10,vx:(Math.random()-.5)*1.5,vy:-(1+Math.random()*3),life:1,size:2+Math.random()*6,hue:Math.random()*30});
      for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.011;if(p.life<=0){pts.splice(i,1);continue;}const s=Math.max(0.001,p.size);const g=ctx.createRadialGradient(p.x,p.y,0.001,p.x,p.y,s);g.addColorStop(0,`hsla(${p.hue},100%,80%,${p.life})`);g.addColorStop(1,`hsla(${p.hue+20},100%,40%,0)`);ctx.beginPath();ctx.arc(p.x,p.y,s,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}
    }else if(theme==="light"){
      const cols=["#ff69b4","#ffd700","#87ceeb","#c9a0dc","#98fb98","#ffb347","#fff"];
      for(let i=0;i<4;i++)pts.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*2,vy:1+Math.random()*2.5,life:1,size:4+Math.random()*7,color:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.15});
      for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;p.life-=0.007;if(p.life<=0||p.y>cv.height+20){pts.splice(i,1);continue;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.life*.9;ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();}
    }else{
      const cx=cv.width/2,cy=cv.height/2;
      for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2;pts.push({x:cx,y:cy,vx:Math.cos(a)*(1+Math.random()*4),vy:Math.sin(a)*(1+Math.random()*4),life:1,size:1+Math.random()*2.5,hue:180+Math.random()*60});}
      for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=1.02;p.vy*=1.02;p.life-=0.016;if(p.life<=0){pts.splice(i,1);continue;}ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.001,p.size),0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,70%,${p.life})`;ctx.fill();}
    }
    if(pts.length>400)pts.splice(0,pts.length-400);
    requestAnimationFrame(loop);
  }
  loop();
})();

// Stars
(function(){
  const c=document.getElementById("stars");
  for(let i=0;i<90;i++){
    const d=document.createElement("div");d.className="star";
    const big=Math.random()>.8;
    d.style.cssText=`width:${big?2:1}px;height:${big?2:1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${.1+Math.random()*.8}`;
    c.appendChild(d);
  }
})();

applyTheme();
restartMusic();
